<!DOCTYPE html>
<html>
    <head>
        <title>Grid practice </title>
    </head>
    <body style="padding-bottom: 1000px;">
        <div style="
        display:grid;
        grid-template-columns: 100px 100px 200px;
        ">
        <div style="background-color: lightblue;">div1</div>
        <div style="background-color: lightgreen;">div2 <p>hello</p></div>
        <div style="background-color: lightblue;">div1</div>
        </div>
        <div style="
        margin-top: 30px;
        display:grid;
        grid-template-columns: 100px 100px;
        ">
        <div style="background-color: lightblue;">div1</div>
        <div style="background-color: lightgreen;">div2 <p>hello</p></div>
        </div>
        <div style="
        margin-top: 30px;
        display:grid;
        grid-template-columns: 100px 1fr 2fr;
        ">
        <div style="background-color: lightblue;">div1</div>
        <div style="background-color: lightgreen;">div2 <p>hello</p></div>
        <div style="background-color: lightpink;">div1</div>
        </div>
        <div style="
        margin-top: 30px;
        display:grid;
        grid-template-columns: 1fr 1fr 1fr;
        column-gap: 20px;
        row-gap: 40px;
        ">
        <div style="background-color: lightblue;height: 200px;">div1</div>
        <div style="background-color: lightgreen;height: 200px">div2 <p>hello</p></div>
        <div style="background-color: lightpink;height: 200px">div1</div>
        <div style="background-color: rgb(219, 100, 227);height: 200px;">div1</div>
        <div style="background-color: rgb(15, 139, 15);height: 200px">div2 <p>hello</p></div>
        <div style="background-color: rgb(200, 35, 60);height: 200px">div1</div>
        </div>
    </body>

</html>
